name: Build Windows release

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 0.13.0'
        required: true
        default: '0.13.0'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ github.event.inputs.version || '0.13.0' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Download Electron runtime
        working-directory: app
        run: node node_modules/electron/install.js

      - name: Build portable desktop package
        working-directory: app
        run: npm run package:desktop

      - name: Create archive and checksum
        shell: pwsh
        run: |
          $package = "app/releases/Mitchells-Working-Tool-$env:RELEASE_VERSION-win32-x64"
          $archive = "Mitchells-Working-Tool-v$env:RELEASE_VERSION-windows-x64.zip"
          Compress-Archive -Path "$package/*" -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          "$hash  $archive" | Set-Content -LiteralPath "$archive.sha256" -Encoding utf8

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: Mitchell's Working Tool v${{ env.RELEASE_VERSION }}
          generate_release_notes: true
          files: |
            Mitchells-Working-Tool-v${{ env.RELEASE_VERSION }}-windows-x64.zip
            Mitchells-Working-Tool-v${{ env.RELEASE_VERSION }}-windows-x64.zip.sha256

